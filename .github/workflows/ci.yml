name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble book.md
        run: bash build-book.sh

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in chapters/ and docs/
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress chapters docs
          fail: true
          failIfEmpty: false

  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
